[package]
name = "rsqlite-wasm"
# Ships ahead of the rest of the family: 0.1.2 added the node:fs file backend,
# 0.1.3 added `PRAGMA synchronous`, 0.1.4 adds B-tree index seeks + in-place
# deletes (turning PK/UNIQUE reads and single-row deletes O(log n)), landing
# across rsqlite-core/-storage. From 0.1.4 the whole family shares one version.
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
description = "WebAssembly bindings for rsqlite — SQLite in the browser"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Compiles the `node:fs`-backed file VFS (server/Deno persistence). Enabled
# only for the `--target nodejs` build; MUST stay off for the browser build,
# whose bundle cannot resolve the `import ... from "node:fs"` it generates.
nodefs = []

[dependencies]
rsqlite-core = { workspace = true }
rsqlite-vfs = { workspace = true, default-features = false }
thiserror = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WorkerGlobalScope",
    "WorkerNavigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemSyncAccessHandle",
    "FileSystemReadWriteOptions",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "DomStringList",
    "Event",
    "console",
    "EventTarget",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
